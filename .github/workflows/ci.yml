name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot .NET
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.5.1
          use-dotnet: true

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve Godot executable
        shell: bash
        run: echo "GODOT_BIN=$(command -v godot)" >> "$GITHUB_ENV"

      # Must run before any main-project Godot process (bootstrap, suites):
      # the Godot .NET editor import would otherwise drive the C# build.
      - name: Build root C# project
        shell: bash
        run: dotnet build GodotE2E.csproj

      - name: Install Xvfb
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb

      - name: Bootstrap GdUnit4
        shell: bash
        run: ./scripts/bootstrap_gdunit4.sh

      - name: Verify clean GDScript-only bootstrap import
        shell: bash
        run: bash tests/scripts/bootstrap_gdunit4_import_test.sh

      - name: Run normal unit and integration suites
        shell: bash
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24"
          ./addons/gdUnit4/runtest.sh -a tests/unit -a tests/integration -c

      - name: Run C# test suites
        shell: bash
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24"
          dotnet test tests/csharp/GodotE2E.Tests.csproj --logger trx

      - name: Run expected-failure artifact harness
        shell: bash
        run: |
          harness_output="test_output/failure_harness_test/test_real_failure_captures_artifacts"
          rm -rf -- "$harness_output"
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            ./addons/gdUnit4/runtest.sh -a tests/fixtures/failure_harness_test.gd
          status=$?
          set -e
          if [ "$status" -ne 100 ]; then
            echo "Expected the failure harness to exit 100, got $status" >&2
            exit 1
          fi
          expected_artifacts=(
            screenshot.png
            scene_tree.json
            engine_logs.json
            stdout.log
            stderr.log
          )
          for artifact in "${expected_artifacts[@]}"; do
            if [ ! -f "$harness_output/$artifact" ]; then
              echo "Missing failure harness artifact: $harness_output/$artifact" >&2
              exit 1
            fi
          done

      - name: Verify no E2E child survives
        if: always()
        shell: bash
        run: bash tests/scripts/assert_no_e2e_children.sh

      - name: Verify release package contract
        shell: bash
        run: bash tests/scripts/package_release_test.sh

      - name: Upload C# TestResults
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-csharp-testresults
          if-no-files-found: ignore
          path: tests/csharp/TestResults

      - name: Upload reports and test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-artifacts
          if-no-files-found: warn
          path: |
            reports
            test_output

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot .NET
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.5.1
          use-dotnet: true

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve Godot executable
        shell: bash
        run: |
          godot_path="$(command -v godot)"
          if command -v cygpath >/dev/null 2>&1; then
            godot_path="$(cygpath --windows "$godot_path")"
          fi
          echo "GODOT_BIN=$godot_path" >> "$GITHUB_ENV"

      # Must run before any main-project Godot process (bootstrap, suites):
      # the Godot .NET editor import would otherwise drive the C# build.
      - name: Build root C# project
        shell: bash
        run: dotnet build GodotE2E.csproj

      - name: Bootstrap GdUnit4
        shell: bash
        run: ./scripts/bootstrap_gdunit4.sh

      - name: Verify clean GDScript-only bootstrap import
        shell: bash
        run: bash tests/scripts/bootstrap_gdunit4_import_test.sh

      - name: Run normal unit and integration suites
        shell: bash
        run: ./addons/gdUnit4/runtest.sh -a tests/unit -a tests/integration -c

      # GODOT_BIN (resolved above, as a Windows path) tells the C# tests where
      # the Godot .NET executable lives; it propagates to launched children.
      - name: Run C# test suites
        shell: bash
        run: dotnet test tests/csharp/GodotE2E.Tests.csproj --logger trx

      - name: Run expected-failure artifact harness
        shell: bash
        run: |
          harness_output="test_output/failure_harness_test/test_real_failure_captures_artifacts"
          rm -rf -- "$harness_output"
          set +e
          ./addons/gdUnit4/runtest.sh -a tests/fixtures/failure_harness_test.gd
          status=$?
          set -e
          if [ "$status" -ne 100 ]; then
            echo "Expected the failure harness to exit 100, got $status" >&2
            exit 1
          fi
          expected_artifacts=(
            screenshot.png
            scene_tree.json
            engine_logs.json
            stdout.log
            stderr.log
          )
          for artifact in "${expected_artifacts[@]}"; do
            if [ ! -f "$harness_output/$artifact" ]; then
              echo "Missing failure harness artifact: $harness_output/$artifact" >&2
              exit 1
            fi
          done

      - name: Verify no E2E child survives
        if: always()
        shell: bash
        run: bash tests/scripts/assert_no_e2e_children.sh

      - name: Upload C# TestResults
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-csharp-testresults
          if-no-files-found: ignore
          path: tests/csharp/TestResults

      - name: Upload reports and test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-artifacts
          if-no-files-found: warn
          path: |
            reports
            test_output

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be stable SemVer: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release archive
        shell: bash
        run: ./scripts/package_release.sh "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/godot-e2e-$VERSION.zip"
          --generate-notes
          --title "$GITHUB_REF_NAME"
